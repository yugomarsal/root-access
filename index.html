<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Root Access</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #020202;
      color: #00ff9f;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* CRT Scanline Effect */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 999;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #00ff9f44;
      margin-bottom: 20px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-area img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #00ff9f;
      box-shadow: 0 0 12px #00ff9f88;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #00ff9f;
      text-shadow: 0 0 10px #00ff9f;
    }

    .stats {
      text-align: right;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .stats span { color: #fff; }

    /* Screens */
    .screen { display: none; }
    .screen.active { display: block; }

    /* Terminal Box */
    .terminal {
      background: #0a0f0a;
      border: 1px solid #00ff9f55;
      border-radius: 6px;
      padding: 22px;
      min-height: 440px;
      box-shadow: 0 0 40px #00ff9f15, inset 0 0 30px #00ff9f08;
      position: relative;
    }

    .terminal::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 28px;
      background: #111;
      border-bottom: 1px solid #00ff9f33;
      border-radius: 6px 6px 0 0;
    }

    .terminal-header {
      position: absolute;
      top: 6px;
      left: 14px;
      font-size: 0.75rem;
      color: #00ff9f99;
      letter-spacing: 1px;
    }

    /* Start Screen */
    #start-screen {
      text-align: center;
      padding: 30px 10px;
    }

    #start-screen img {
      width: 140px;
      border-radius: 50%;
      border: 3px solid #00ff9f;
      box-shadow: 0 0 30px #00ff9faa;
      margin-bottom: 20px;
    }

    #start-screen h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.4rem;
      margin-bottom: 8px;
      text-shadow: 0 0 20px #00ff9f;
      letter-spacing: 4px;
    }

    #start-screen p {
      color: #88aa88;
      margin-bottom: 35px;
      line-height: 1.7;
      font-size: 0.95rem;
    }

    /* Level Select */
    .level-select {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }

    .level-btn {
      background: transparent;
      border: 1px solid #00ff9f66;
      color: #00ff9f;
      padding: 16px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.05rem;
      cursor: pointer;
      transition: 0.25s;
      text-align: left;
      position: relative;
    }

    .level-btn:hover {
      background: #00ff9f18;
      border-color: #00ff9f;
      box-shadow: 0 0 18px #00ff9f44;
    }

    .level-btn span {
      display: block;
      font-size: 0.8rem;
      color: #88aa88;
      margin-top: 4px;
    }

    /* Buttons */
    .btn {
      background: transparent;
      border: 2px solid #00ff9f;
      color: #00ff9f;
      padding: 13px 36px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn:hover {
      background: #00ff9f;
      color: #000;
      box-shadow: 0 0 25px #00ff9f;
    }

    /* Game Content */
    .level-badge {
      display: inline-block;
      background: #00ff9f15;
      border: 1px solid #00ff9f;
      padding: 3px 12px;
      font-size: 0.8rem;
      margin-bottom: 18px;
      letter-spacing: 1px;
      color: #00ff9f;
    }

    .story {
      color: #7dffb3;
      margin-bottom: 16px;
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .question {
      font-size: 1.1rem;
      margin-bottom: 22px;
      line-height: 1.5;
      color: #e0ffe0;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option {
      background: #0d150d;
      border: 1px solid #00ff9f44;
      padding: 13px 16px;
      cursor: pointer;
      transition: 0.2s;
      text-align: left;
      color: #00ff9f;
    }

    .option:hover {
      background: #00ff9f18;
      border-color: #00ff9f;
      box-shadow: 0 0 12px #00ff9f33;
    }

    .option.correct {
      background: #00ff8822;
      border-color: #00ff88;
      color: #00ff88;
    }

    .option.wrong {
      background: #ff004422;
      border-color: #ff0044;
      color: #ff6b6b;
    }

    /* Hard Input */
    .input-area { margin-top: 10px; }

    .input-area input {
      width: 100%;
      background: #0a120a;
      border: 1px solid #00ff9f;
      color: #00ff9f;
      padding: 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.05rem;
      outline: none;
    }

    .input-area input:focus {
      box-shadow: 0 0 15px #00ff9f55;
    }

    .submit-btn {
      margin-top: 12px;
      width: 100%;
    }

    /* Result */
    #result-screen {
      text-align: center;
      padding: 40px 15px;
    }

    #result-screen h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.9rem;
      margin-bottom: 12px;
      text-shadow: 0 0 15px #00ff9f;
    }

    .final-score {
      font-size: 2.8rem;
      color: #fff;
      margin: 18px 0;
      text-shadow: 0 0 20px #00ff9f;
    }

    .rank {
      font-size: 1.15rem;
      color: #7dffb3;
      margin-bottom: 28px;
    }

    .lives { color: #ff4d6d; }

    @media (max-width: 600px) {
      .title { font-size: 1.2rem; }
      #start-screen h1 { font-size: 1.8rem; }
      .logo-area img { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-area">
        <img src="https://iili.io/CZZM5KB.md.jpg" alt="Logo">
        <div class="title">ROOT ACCESS</div>
      </div>
      <div class="stats">
        <div>SCORE: <span id="score">0</span></div>
        <div class="lives">LIVES: <span id="lives">♥ ♥ ♥</span></div>
      </div>
    </header>

    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
      <div class="terminal">
        <div class="terminal-header">root@pepe:~$</div>
        <br><br>
        <img src="https://iili.io/CZZM5KB.md.jpg" alt="Logo" style="width:130px; border-radius:50%; border:3px solid #00ff9f; box-shadow:0 0 25px #00ff9faa;">
        <h1>ROOT ACCESS</h1>
        <p>
          > System initialized...<br>
          > Awaiting operator clearance<br>
          > Select difficulty to begin
        </p>

        <div class="level-select">
          <button class="level-btn" onclick="startLevel('easy')">
            [1] ACCESS_GRANTED
            <span>Easy • Multiple Choice (A B C)</span>
          </button>
          <button class="level-btn" onclick="startLevel('medium')">
            [2] BREACH_IN_PROGRESS
            <span>Medium • Story + Multiple Choice (A B C D)</span>
          </button>
          <button class="level-btn" onclick="startLevel('hard')">
            [3] ROOT_ACCESS
            <span>Hard • Type the command manually</span>
          </button>
        </div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
      <div class="terminal">
        <div class="terminal-header">root@pepe:~/mission$</div>
        <br><br>
        <div class="level-badge" id="level-badge">LEVEL: ACCESS_GRANTED</div>
        <div class="story" id="story"></div>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <div class="input-area" id="input-area" style="display:none;">
          <input type="text" id="answer-input" placeholder="type command here..." autocomplete="off" spellcheck="false">
          <button class="btn submit-btn" onclick="checkTypedAnswer()">EXECUTE</button>
        </div>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="screen">
      <div class="terminal" style="text-align:center; padding-top:50px;">
        <div class="terminal-header">root@pepe:~$</div>
        <br><br>
        <h2 id="result-title">ACCESS GRANTED</h2>
        <div class="final-score" id="final-score">0</div>
        <div class="rank" id="rank">Elite Operator</div>
        <button class="btn" onclick="location.reload()">REBOOT SYSTEM</button>
      </div>
    </div>
  </div>

  <script>
    const questions = {
      easy: [
        { q: "What command lists files in the current directory?", options: ["ls", "cd", "pwd"], answer: 0 },
        { q: "Which command shows the current working directory?", options: ["pwd", "ls", "whoami"], answer: 0 },
        { q: "What does 'cd' stand for?", options: ["Change Directory", "Copy Data", "Clear Disk"], answer: 0 },
        { q: "Which command creates a new directory?", options: ["mkdir", "rmdir", "touch"], answer: 0 },
        { q: "What command clears the terminal screen?", options: ["clear", "cls", "reset"], answer: 0 },
        { q: "Which command shows the current user?", options: ["whoami", "user", "id"], answer: 0 },
        { q: "What does the 'rm' command do?", options: ["Remove files", "Rename files", "Read memory"], answer: 0 },
        { q: "Which symbol starts a comment in most shells?", options: ["#", "//", "--"], answer: 0 },
        { q: "What command displays the manual of a command?", options: ["man", "help", "info"], answer: 0 },
        { q: "Which command is used to copy files?", options: ["cp", "mv", "copy"], answer: 0 }
      ],
      medium: [
        { story: "Pepe has gained access to a restricted server. The system is asking for the current working directory.", q: "Which command should he use?", options: ["ls", "pwd", "whoami", "clear"], answer: 1 },
        { story: "A suspicious process is running. Pepe needs to inspect active processes.", q: "What command shows running processes?", options: ["ps", "top", "both A and B", "kill"], answer: 2 },
        { story: "Pepe found a file named 'secret.txt'. He wants to read its content.", q: "Which command should he use?", options: ["cat secret.txt", "ls secret.txt", "cd secret.txt", "rm secret.txt"], answer: 0 },
        { story: "The server disk is almost full. Pepe needs to check disk usage.", q: "What command shows disk space in human-readable format?", options: ["df -h", "du", "free", "ls -lh"], answer: 0 },
        { story: "Pepe needs to make a script executable.", q: "Which command is correct?", options: ["chmod +x script.sh", "chown +x script.sh", "perm +x script.sh", "exec script.sh"], answer: 0 },
        { story: "Someone left a backdoor. Pepe wants to see who is currently logged in.", q: "What command shows logged-in users?", options: ["who", "w", "both A and B", "users"], answer: 2 },
        { story: "Pepe needs to search for the word 'password' inside all files in the current directory.", q: "Which command is most suitable?", options: ["grep -r password .", "find password", "search password", "locate password"], answer: 0 },
        { story: "The connection feels slow. Pepe wants to test connectivity to google.com.", q: "What command should he use?", options: ["ping google.com", "curl google.com", "wget google.com", "trace google.com"], answer: 0 },
        { story: "Pepe wants to see the last 20 lines of a log file.", q: "Which command is correct?", options: ["tail -n 20 logfile.log", "head -n 20 logfile.log", "cat -n 20 logfile.log", "less 20 logfile.log"], answer: 0 },
        { story: "Pepe needs elevated privileges temporarily.", q: "What is the most common command to become root?", options: ["sudo su", "su root", "login root", "root"], answer: 0 }
      ],
      hard: [
        { q: "Type the command to list all files including hidden ones:", answers: ["ls -a", "ls -la", "ls -al"] },
        { q: "Type the command to create a directory named 'hack':", answers: ["mkdir hack"] },
        { q: "Type the command to remove a file named 'temp.txt':", answers: ["rm temp.txt"] },
        { q: "Type the command to show the current user:", answers: ["whoami"] },
        { q: "Type the command to clear the terminal:", answers: ["clear"] },
        { q: "Type the command to change to the home directory:", answers: ["cd ~", "cd", "cd $HOME"] },
        { q: "Type the command to display the manual for 'ls':", answers: ["man ls"] },
        { q: "Type the command to make 'script.sh' executable:", answers: ["chmod +x script.sh", "chmod 755 script.sh"] },
        { q: "Type the command to show disk usage in human readable format:", answers: ["df -h"] },
        { q: "Type the command to switch to root using sudo:", answers: ["sudo su", "sudo -i", "sudo bash"] }
      ]
    };

    let currentLevel = "easy";
    let currentIndex = 0;
    let score = 0;
    let lives = 3;

    const levelNames = {
      easy: "ACCESS_GRANTED",
      medium: "BREACH_IN_PROGRESS",
      hard: "ROOT_ACCESS"
    };

    function startLevel(level) {
      currentLevel = level;
      currentIndex = 0;
      score = 0;
      lives = 3;
      updateStats();

      document.getElementById("start-screen").classList.remove("active");
      document.getElementById("game-screen").classList.add("active");
      loadQuestion();
    }

    function updateStats() {
      document.getElementById("score").textContent = score;
      document.getElementById("lives").textContent = lives > 0 ? "♥ ".repeat(lives).trim() : "DEAD";
    }

    function loadQuestion() {
      const qList = questions[currentLevel];
      if (currentIndex >= qList.length) {
        endGame(true);
        return;
      }

      const q = qList[currentIndex];
      document.getElementById("level-badge").textContent = "LEVEL: " + levelNames[currentLevel];

      const storyEl = document.getElementById("story");
      if (q.story) {
        storyEl.style.display = "block";
        storyEl.textContent = "> " + q.story;
      } else {
        storyEl.style.display = "none";
      }

      document.getElementById("question").textContent = "> " + q.q;

      const optionsEl = document.getElementById("options");
      const inputArea = document.getElementById("input-area");

      if (currentLevel === "hard") {
        optionsEl.style.display = "none";
        inputArea.style.display = "block";
        document.getElementById("answer-input").value = "";
        setTimeout(() => document.getElementById("answer-input").focus(), 100);
      } else {
        inputArea.style.display = "none";
        optionsEl.style.display = "flex";
        optionsEl.innerHTML = "";

        q.options.forEach((opt, i) => {
          const div = document.createElement("div");
          div.className = "option";
          div.textContent = String.fromCharCode(65 + i) + ". " + opt;
          div.onclick = () => checkAnswer(i);
          optionsEl.appendChild(div);
        });
      }
      updateStats();
    }

    function checkAnswer(selected) {
      const q = questions[currentLevel][currentIndex];
      const options = document.querySelectorAll(".option");
      options.forEach(opt => opt.style.pointerEvents = "none");

      if (selected === q.answer) {
        options[selected].classList.add("correct");
        score += currentLevel === "easy" ? 100 : 150;
      } else {
        options[selected].classList.add("wrong");
        options[q.answer].classList.add("correct");
        lives--;
      }

      setTimeout(() => {
        if (lives <= 0) {
          endGame(false);
          return;
        }
        currentIndex++;
        loadQuestion();
      }, 850);
    }

    function checkTypedAnswer() {
      const input = document.getElementById("answer-input").value.trim().toLowerCase();
      const q = questions[currentLevel][currentIndex];
      const correct = q.answers.some(ans => ans.toLowerCase() === input);

      if (correct) {
        score += 200;
      } else {
        lives--;
      }

      if (lives <= 0) {
        endGame(false);
        return;
      }
      currentIndex++;
      loadQuestion();
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && currentLevel === "hard" && document.getElementById("game-screen").classList.contains("active")) {
        checkTypedAnswer();
      }
    });

    function endGame(won) {
      document.getElementById("game-screen").classList.remove("active");
      document.getElementById("result-screen").classList.add("active");
      document.getElementById("final-score").textContent = score;

      if (won) {
        document.getElementById("result-title").textContent = "ROOT ACCESS GRANTED";
        document.getElementById("rank").textContent = score >= 1800 ? "Elite Operator" : "Skilled Hacker";
      } else {
        document.getElementById("result-title").textContent = "ACCESS DENIED";
        document.getElementById("rank").textContent = "Connection terminated...";
      }
    }
  </script>
</body>
</html>
